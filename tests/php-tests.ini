;
; PHP configuration for Nette Tester
;
; This file is used by Nette Tester (https://tester.nette.org/) to configure
; the PHP environment when running tests.
;
; Usage: tester -c ./tests/php-tests.ini ./tests/KdybyTests/
;

; Extensions required for testing BootstrapFormRenderer
; Nette Tester starts child PHP processes with -n, so PDO must be
; loaded explicitly before the PDO SQLite driver.
extension=ctype.so
extension=json.so
extension=tokenizer.so
extension=mbstring.so
extension=pdo.so
extension=pdo_sqlite.so
