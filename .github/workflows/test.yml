name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-24.04']
        php-version: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3']

    name: ${{ matrix.os }} / PHP ${{ matrix.php-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        tools: composer:v2.2

    - name: Remove JSON extension configuration for PHP 8
      if: startsWith(matrix.php-version, '8')
      run: sed -i '/^extension=json\.so$/d' ./tests/php-tests.ini

    - name: Diagnose pdo_sqlite extension
      run: |
        php --version
        php --ini
        php -r 'printf("default: pdo=%s sqlite=%s drivers=%s\n", extension_loaded("PDO") ? "yes" : "no", extension_loaded("pdo_sqlite") ? "yes" : "no", json_encode(PDO::getAvailableDrivers()));'
        php -n -c ./tests/php-tests.ini -r 'printf("tester: pdo=%s sqlite=%s drivers=%s\n", extension_loaded("PDO") ? "yes" : "no", extension_loaded("pdo_sqlite") ? "yes" : "no", json_encode(PDO::getAvailableDrivers()));'

    - name: Resolve runtime-compatible dependencies
      run: composer update --no-interaction --prefer-source

    - name: Run parallel-lint
      run: composer lint

    - name: Tester environment
      run: composer test:info

    - name: Run tests
      run: composer test:junit > ./test-results.xml

    - name: Display test failures
      if: failure()
      run: for i in $(find ./tests -name \*.actual); do echo "--- $i"; cat $i; echo; echo; done

    - name: Publish test results
      uses: dorny/test-reporter@v3.0.0
      if: always()
      with:
        name: Test Results (PHP ${{ matrix.php-version }})
        path: ./test-results.xml
        reporter: tester-junit

  integration:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
        - php-version: '7.1'
          dependency-set: lowest
          latte: '2.6.0'
          application: '3.0.8'
          forms: '3.0.7'
          utils: '3.1.0'
        - php-version: '7.2'
          dependency-set: highest-nette-3.1
          latte: '^2.7.1'
          application: '~3.1.0'
          forms: '~3.1.0'
          utils: '^3.2.5'
        - php-version: '7.4'
          dependency-set: highest-nette-3.0
          latte: '^2.6'
          application: '~3.0.0'
          forms: '~3.0.0'
          utils: '^3.1'
        - php-version: '8.0'
          dependency-set: highest-nette-3.0
          latte: '^2.6'
          application: '~3.0.0'
          forms: '~3.0.0'
          utils: '^3.1'
        - php-version: '8.1'
          dependency-set: highest-nette-3.1
          latte: '^2.7.1'
          application: '~3.1.0'
          forms: '~3.1.0'
          utils: '^3.2.5'
        - php-version: '8.2'
          dependency-set: highest-nette-3.1
          latte: '^2.7.1'
          application: '~3.1.0'
          forms: '~3.1.0'
          utils: '^3.2.5'
        - php-version: '8.3'
          dependency-set: highest-nette-3.1
          latte: '^2.7.1'
          application: '~3.1.0'
          forms: '~3.1.0'
          utils: '^3.2.5'

    name: Integration / PHP ${{ matrix.php-version }} / ${{ matrix.dependency-set }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        tools: composer:v2.2

    - name: Resolve application dependencies
      working-directory: tests/integration
      run: |
        composer update --no-interaction --prefer-dist \
          --with "latte/latte:${{ matrix.latte }}" \
          --with "nette/application:${{ matrix.application }}" \
          --with "nette/forms:${{ matrix.forms }}" \
          --with "nette/utils:${{ matrix.utils }}"

    - name: Run integration application
      working-directory: tests/integration
      run: php smoke.php
