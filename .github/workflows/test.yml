name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-24.04']
        php-version: ['5.6', '7.1', '7.2', '7.4', '8.0']

    name: ${{ matrix.os }} / PHP ${{ matrix.php-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        tools: composer:v2.2

    - name: Diagnose pdo_sqlite extension
      run: |
        php --version
        php --ini
        php -r 'printf("default: pdo=%s sqlite=%s drivers=%s\n", extension_loaded("PDO") ? "yes" : "no", extension_loaded("pdo_sqlite") ? "yes" : "no", json_encode(PDO::getAvailableDrivers()));'
        php -n -c ./tests/php-tests.ini -r 'printf("tester: pdo=%s sqlite=%s drivers=%s\n", extension_loaded("PDO") ? "yes" : "no", extension_loaded("pdo_sqlite") ? "yes" : "no", json_encode(PDO::getAvailableDrivers()));'

    - name: Install dependencies
      run: composer install --no-interaction --prefer-source --dev

    - name: Run parallel-lint
      run: composer lint

    - name: Tester environment
      run: composer test:info

    - name: Run tests
      run: composer test:junit > ./test-results.xml

    - name: Display test failures
      if: failure()
      run: for i in $(find ./tests -name \*.actual); do echo "--- $i"; cat $i; echo; echo; done

    - name: Publish test results
      uses: dorny/test-reporter@v3.0.0
      if: always()
      with:
        name: Test Results (PHP ${{ matrix.php-version }})
        path: ./test-results.xml
        reporter: tester-junit
